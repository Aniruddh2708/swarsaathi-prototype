name: Swift checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Core regression tests (Apple Accelerate path)
        run: swift test --configuration release --jobs 2
      - name: Build application for simulator
        run: >-
          xcodebuild -project SwarSaathi.xcodeproj -scheme SwarSaathi
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO build
